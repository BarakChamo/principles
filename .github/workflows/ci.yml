name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspaces
      - run: npm pack --dry-run --workspaces
      # ESM packaging smoke: every package's built entry must import under plain Node.
      - run: |
          node -e "await import('./packages/result/dist/index.js')"
          node -e "await import('./packages/invariant/dist/index.js')"
          node -e "await import('./packages/env/dist/index.js')"
          node -e "await import('./packages/env/dist/typed-env/next.js')"
          node -e "await import('./packages/env/dist/node.js')"
