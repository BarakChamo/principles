name: Publish to npm (trusted publishing)

# Manual until trusted publishers are configured for @tenets/result and
# @tenets/invariant on npmjs.com (package Settings -> Trusted Publisher ->
# GitHub Actions: BarakChamo/tenets, workflow npm-publish.yml). Then switch
# the trigger to `release: types: [published]`.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build --workspaces
      - run: npm publish --workspaces --access public
