name: Publish to npm

# Uses the NPM_TOKEN secret. Migration path: configure trusted publishers for
# @tenets/result and @tenets/invariant on npmjs.com (Settings -> Trusted
# Publisher -> GitHub Actions: BarakChamo/tenets, workflow npm-publish.yml),
# then delete the secret and the NODE_AUTH_TOKEN env line — OIDC takes over
# and provenance is generated automatically.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance / future trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build --workspaces
      - run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
